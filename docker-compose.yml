services:
  travelmind:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - path: .env.local
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8765,http://127.0.0.1:8765
      SEMANTIC_MEMORY_ENABLED: "0"
      TRAVEL_KNOWLEDGE_ENABLED: "0"
    volumes:
      - travelmind-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - travelmind-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  travelmind-data:
  travelmind-redis:
